name: Lint

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_call:

jobs:
  lint:
    name: Lint on latest Node
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository 🛎️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run lint:typescript && bun run lint:check
